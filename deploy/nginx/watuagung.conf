# Nginx Watuagung: static export Next.js + Laravel API pada satu origin.
# Pasang: /etc/nginx/sites-available/watuagung.conf (symlink ke sites-enabled) dan
# watuagung-headers.conf ke /etc/nginx/snippets/. Langkah lengkap: deploy/server-setup.md.
#
# Ganti sebelum dipakai (Nginx tidak membaca variabel environment):
#   example.id                 -> domain desa (juga path sertifikat)
#   /var/www/watuagung         -> WEB_ROOT, isi out/ (sama dengan deploy.sh)
#   /srv/watuagung             -> APP_DIR, checkout repo (sama dengan deploy.sh)
#   /run/php/php8.3-fpm.sock   -> socket PHP-FPM yang terpasang
# Uji dengan `sudo nginx -t` sebelum `sudo systemctl reload nginx`.

# Tanpa query string dan tanpa Referer: pencarian petugas (?q=) bisa berisi nama warga, dan
# Referer API membawa URL halaman admin lengkap dengan filter. $uri = path tanpa query.
# Dipakai untuk seluruh server (bukan hanya /api/) karena URL halaman admin, cek status (?id=)
# dan verifikasi (?kode=) juga membawa query.
log_format watuagung_noquery '$remote_addr [$time_local] "$request_method $uri $server_protocol" '
                             '$status $body_bytes_sent $request_time "$http_user_agent"';

server {
    listen 80;
    listen [::]:80;
    server_name example.id www.example.id;
    server_tokens off;
    access_log /var/log/nginx/watuagung.access.log watuagung_noquery;

    # Redirect di level location (bukan server) agar location tantangan ACME yang
    # disisipkan certbot --nginx saat perpanjangan tetap terpilih.
    location / {
        return 301 https://example.id$request_uri;
    }
}

server {
    # `listen ... http2` agar jalan di Nginx 1.24 (Ubuntu 24.04). Di Nginx >= 1.25.1 ganti
    # menjadi `listen 443 ssl;` + `http2 on;` untuk menghilangkan peringatan deprecated.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name example.id www.example.id;
    server_tokens off;

    # Dibuat oleh `certbot certonly --nginx -d example.id -d www.example.id`.
    ssl_certificate /etc/letsencrypt/live/example.id/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.id/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /var/www/watuagung;
    index index.html;
    access_log /var/log/nginx/watuagung.access.log watuagung_noquery;

    # PDF APBDes <= 10 MB + overhead multipart. PHP: upload_max_filesize/post_max_size 12M.
    client_max_body_size 12m;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/javascript application/javascript application/json image/svg+xml;

    include snippets/watuagung-headers.conf;
    error_page 404 /404.html;

    # Halaman statis. HTML harus divalidasi ulang: deploy.sh menghapus chunk lama (rsync --delete),
    # HTML basi di cache browser akan merujuk chunk yang sudah hilang.
    location / {
        try_files $uri $uri/ $uri.html =404;
        include snippets/watuagung-headers.conf;
        add_header Cache-Control "no-cache";
    }

    # Nama file berisi hash build, aman di-cache selamanya.
    location ^~ /_next/static/ {
        try_files $uri =404;
        include snippets/watuagung-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Semua /api/ ke front controller Laravel. SCRIPT_FILENAME tetap, sehingga tidak ada file
    # lain dari backend/ yang bisa disajikan atau dieksekusi lewat URL.
    location ^~ /api/ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /srv/watuagung/backend/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param DOCUMENT_ROOT /srv/watuagung/backend/public;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        # Galat API tetap JSON dari Laravel, bukan /404.html.
        fastcgi_intercept_errors off;
    }

    # Media publik (sampul berita, foto UMKM, bagan struktur, PDF APBDes), hanya file statis.
    # MEDIA_URL kosong di backend/.env => URL Laravel = APP_URL/storage/... sesuai alias ini.
    # storage/app/private (PDF surat terenkripsi) tidak pernah terjangkau.
    location ^~ /storage/ {
        alias /srv/watuagung/backend/storage/app/public/;
        autoindex off;
        location ~ \.php$ { deny all; }
        location ~ /\. { deny all; }
        include snippets/watuagung-headers.conf;
        add_header Cache-Control "public, max-age=604800";
    }

    # Tantangan ACME boleh, file tersembunyi lain (/.env, /.git) ditolak.
    location ^~ /.well-known/acme-challenge/ {
        try_files $uri =404;
    }
    location ~ /\. {
        deny all;
    }
}
