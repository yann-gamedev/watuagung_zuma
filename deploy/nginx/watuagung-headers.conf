# Header keamanan Watuagung. Salin ke /etc/nginx/snippets/watuagung-headers.conf.
# Di-include di server 443 DAN di setiap location yang punya add_header sendiri:
# Nginx membuang add_header warisan begitu sebuah location memakai add_header.
add_header Strict-Transport-Security "max-age=31536000" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Frame-Options "DENY" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

# CSP masih Report-Only: pelanggaran hanya tampil di console browser, tidak memblokir.
# Ubah nama header menjadi Content-Security-Policy (enforce) setelah seminggu tanpa laporan
# pelanggaran di console pada beranda, /profil/, /kontak/, /pelayanan/, video YouTube yang
# diputar, dan panel admin (pratinjau foto, buka/unduh PDF surat, pratinjau peta).
#
# script-src 'unsafe-inline': static export Next.js menulis puluhan <script> inline per
#   halaman (payload RSC self.__next_f.push dan bootstrap $RB/$RV). Isinya berubah tiap build
#   dan tanpa server Next.js tidak ada nonce; hash per build tidak praktis dipelihara di Nginx.
#   Tidak ada eval/new Function di bundle, jadi 'unsafe-eval' tidak perlu.
# style-src 'unsafe-inline': HTML hasil export memuat atribut style="...".
# img-src blob:: pratinjau foto berita/UMKM sebelum diunggah (URL.createObjectURL).
# frame-src: peta Google (www.google.com/maps/embed dan maps.google.com) dan YouTube nocookie.
#   PDF surat dibuka di tab baru lewat blob: (navigasi, bukan frame), tidak perlu frame-src blob:.
add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://i.ytimg.com; font-src 'self'; connect-src 'self'; frame-src https://www.google.com https://maps.google.com https://www.youtube-nocookie.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
